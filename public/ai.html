<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هوش مصنوعی - DNS Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/ai.css">
</head>
<body data-theme="light" data-color="blue">
  <div class="header">
    <div>
      <h1><i class="fas fa-robot"></i> <span id="tAITitle">هوش مصنوعی پنل</span></h1>
      <p id="tAIDesc">با هوش مصنوعی صحبت کنید و پنل را مدیریت کنید</p>
    </div>
    <div class="header-btns">
      <button type="button" class="sbtn" onclick="window.location.href='/dashboard'"><i class="fas fa-arrow-right"></i> <span id="tBack">بازگشت</span></button>
      <button type="button" class="sbtn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> <span id="tLogout">خروج</span></button>
    </div>
  </div>

  <div class="ai-container">
    <div class="ai-chat" id="chatMessages">
      <div class="ai-welcome">
        <div class="ai-welcome-icon"><i class="fas fa-robot"></i></div>
        <h3 id="tWelcomeTitle">به هوش مصنوعی پنل خوش آمدید</h3>
        <p id="tWelcomeText">می‌توانید از من سوال بپرسید یا دستورات زیر را امتحان کنید:</p>
        <div class="ai-commands">
          <div class="ai-command" onclick="sendQuickCommand('ساخت پنل با نام پنل من با 30 روز، 100 گیگ و 10 کاربر')">
            <i class="fas fa-plus-circle"></i> ساخت پنل
          </div>
          <div class="ai-command" onclick="sendQuickCommand('تم رو قهوه‌ای کن')">
            <i class="fas fa-palette"></i> تغییر تم
          </div>
          <div class="ai-command" onclick="sendQuickCommand('حالت رو تاریک کن')">
            <i class="fas fa-moon"></i> حالت تاریک
          </div>
          <div class="ai-command" onclick="sendQuickCommand('لیست پنل‌ها رو نشان بده')">
            <i class="fas fa-list"></i> لیست پنل‌ها
          </div>
          <div class="ai-command" onclick="sendQuickCommand('پنل با نام پنل من رو حذف کن')">
            <i class="fas fa-trash"></i> حذف پنل
          </div>
          <div class="ai-command" onclick="sendQuickCommand('بهترین DNS برای گیمرها کدام است؟')">
            <i class="fas fa-gamepad"></i> DNS گیمینگ
          </div>
        </div>
      </div>
    </div>
    
    <div class="ai-input-box">
      <input type="text" id="aiInput" class="input" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button type="button" class="ai-send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      <button type="button" class="ai-clear-btn" onclick="clearChat()" title="پاک کردن تاریخچه"><i class="fas fa-trash-alt"></i></button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/ai.js"></script>
</body>
</html>
